# Tiny Tapeout project information
project:
  title:        "Joel_Verilog"      # Project title
  author:       "Joel Anthony"      # Your name
  discord:      "joeltrg"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "TBD"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_joel0328"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "cordic_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "WDATA[0] - register write data"
  ui[1]: "WDATA[1] - register write data"
  ui[2]: "WDATA[2] - register write data"
  ui[3]: "WDATA[3] - register write data"
  ui[4]: "WDATA[4] - register write data"
  ui[5]: "WDATA[5] - register write data"
  ui[6]: "WDATA[6] - register write data"
  ui[7]: "WDATA[7] - register write data"

  # Outputs
  uo[0]: "RDATA[0] - addressed register readback"
  uo[1]: "RDATA[1] - addressed register readback"
  uo[2]: "RDATA[2] - addressed register readback"
  uo[3]: "RDATA[3] - addressed register readback"
  uo[4]: "RDATA[4] - addressed register readback"
  uo[5]: "RDATA[5] - addressed register readback"
  uo[6]: "RDATA[6] - addressed register readback"
  uo[7]: "RDATA[7] - addressed register readback"

  # Bidirectional pins
  uio[0]: "ADDR[0] - register address"
  uio[1]: "ADDR[1] - register address"
  uio[2]: "ADDR[2] - register address"
  uio[3]: "ADDR[3] - register address"
  uio[4]: "WE - write enable, edge-detected"
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
